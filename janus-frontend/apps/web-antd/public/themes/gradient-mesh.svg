<svg width="480" height="270" viewBox="0 0 480 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 流体弥散光斑背景 -->
  <rect width="480" height="270" fill="#F8FAFC"/>
  <circle cx="100" cy="60" r="100" fill="#F472B6" opacity="0.45"/>
  <circle cx="380" cy="90" r="110" fill="#A78BFA" opacity="0.45"/>
  <circle cx="260" cy="220" r="120" fill="#38BDF8" opacity="0.4"/>

  <!-- 毛玻璃质感卡片 -->
  <rect x="140" y="32" width="200" height="206" rx="18" fill="#FFFFFF" fill-opacity="0.8" stroke="#FFFFFF" stroke-width="1.5" filter="drop-shadow(0 15px 35px rgba(167,139,250,0.25))"/>
  
  <rect x="200" y="60" width="80" height="10" rx="3" fill="#1E293B"/>
  <rect x="175" y="76" width="130" height="6" rx="2" fill="#94A3B8"/>
  
  <rect x="165" y="100" width="150" height="22" rx="6" fill="#F1F5F9" fill-opacity="0.7" stroke="#E2E8F0"/>
  <rect x="165" y="130" width="150" height="22" rx="6" fill="#F1F5F9" fill-opacity="0.7" stroke="#E2E8F0"/>
  
  <!-- 流体渐变按钮 -->
  <rect x="165" y="165" width="150" height="26" rx="8" fill="url(#grad-btn)"/>
  <defs>
    <linearGradient id="grad-btn" x1="165" y1="165" x2="315" y2="191" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EC4899"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect x="225" y="174" width="30" height="8" rx="2" fill="#FFFFFF"/>
</svg>
