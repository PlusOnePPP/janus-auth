<svg width="480" height="270" viewBox="0 0 480 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 深蓝科技星轨大屏背景 -->
  <rect width="480" height="270" fill="#070B14"/>
  
  <!-- 网格线 -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0EA5E9" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="480" height="270" fill="url(#grid)"/>

  <!-- 光晕 -->
  <circle cx="160" cy="50" r="80" fill="#0284C7" opacity="0.25" filter="blur(30px)"/>
  <circle cx="320" cy="220" r="90" fill="#4F46E5" opacity="0.25" filter="blur(30px)"/>

  <!-- 科技卡片 -->
  <rect x="135" y="28" width="210" height="214" rx="14" fill="#0F172A" fill-opacity="0.85" stroke="#0284C7" stroke-opacity="0.5" stroke-width="1.5" filter="drop-shadow(0 0 20px rgba(14,165,233,0.25))"/>
  
  <!-- 科技角标 -->
  <path d="M135 45L135 28L152 28" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M345 45L345 28L328 28" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- 标题与发光点 -->
  <circle cx="165" cy="58" r="4" fill="#38BDF8"/>
  <rect x="175" y="54" width="90" height="10" rx="3" fill="#F8FAFC"/>
  <rect x="165" y="70" width="130" height="6" rx="2" fill="#64748B"/>
  
  <!-- 表单项 -->
  <rect x="160" y="92" width="160" height="24" rx="6" fill="#1E293B" stroke="#334155"/>
  <rect x="160" y="124" width="160" height="24" rx="6" fill="#1E293B" stroke="#334155"/>
  <rect x="160" y="156" width="160" height="18" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.4"/>
  
  <!-- 科技按钮 -->
  <rect x="160" y="184" width="160" height="28" rx="6" fill="url(#neon-btn)"/>
  <defs>
    <linearGradient id="neon-btn" x1="160" y1="184" x2="320" y2="212" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284C7"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect x="225" y="194" width="30" height="8" rx="2" fill="#FFFFFF"/>
</svg>
