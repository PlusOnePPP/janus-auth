<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta name="description" content="统一认证中心" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0"
    />
    <!-- 由 vite 注入 VITE_APP_TITLE 变量，在 .env 文件内配置 -->
    <title>%VITE_APP_TITLE%</title>
    <link rel="icon" href="/favicon.ico" />
    <script>
      // 兼容旧版浏览器（如 Chrome 91）：polyfill 必须在任何 ES module 代码执行前注入
      // Object.hasOwn 需要 Chrome 93+ / structuredClone 需要 Chrome 98+
      if (!Object.hasOwn) {
        Object.defineProperty(Object, 'hasOwn', {
          value: function (object, property) {
            if (object == null) {
              throw new TypeError('Cannot convert undefined or null to object');
            }
            return Object.prototype.hasOwnProperty.call(Object(object), property);
          },
          writable: true,
          configurable: true,
        });
      }
      if (typeof window.structuredClone !== 'function') {
        window.structuredClone = function (value) {
          if (value === null || typeof value !== 'object') {
            return value;
          }
          if (value instanceof Date) {
            return new Date(value.getTime());
          }
          if (value instanceof RegExp) {
            return new RegExp(value.source, value.flags);
          }
          if (value instanceof Array) {
            return value.map(window.structuredClone);
          }
          if (value instanceof Map) {
            return new Map(
              Array.from(value, function (entry) {
                return [window.structuredClone(entry[0]), window.structuredClone(entry[1])];
              }),
            );
          }
          if (value instanceof Set) {
            return new Set(
              Array.from(value, function (item) {
                return window.structuredClone(item);
              }),
            );
          }
          var cloned = {};
          for (var key in value) {
            if (Object.prototype.hasOwnProperty.call(value, key)) {
              cloned[key] = window.structuredClone(value[key]);
            }
          }
          return cloned;
        };
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
